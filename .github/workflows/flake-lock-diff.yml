name: Nix Flake Lock

on:
  pull_request:
    paths:
      - "flake.lock"
      - "flake.nix"
      - "home-manager.nix"
      - ".github/scripts/flake-lock-diff.sh"
      - ".github/scripts/package-versions.nix"
      - ".github/workflows/flake-lock-diff.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    name: Diff Package Versions
    runs-on: ubuntu-latest
    steps:
      # For pull_request events, this checks out the merge commit of the PR
      # into its base, so HEAD shows the result of merging the PR.
      - name: Checkout PR merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Compares every flake.lock input, and the version of every package that
      # the nix-darwin and home-manager configurations install.
      - name: Diff flake inputs and package versions
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          body=$(.github/scripts/flake-lock-diff.sh "$BASE_SHA" HEAD)
          printf '%s\n' "$body"
          {
            echo 'body<<COMMENT_EOF'
            printf '%s\n' "$body"
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_BODY: ${{ steps.diff.outputs.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const headSha = process.env.HEAD_SHA;

            // cancel-in-progress is best-effort: a cancelled run can still be
            // mid-flight in the write below. Skip if the PR has moved on.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (pr.head.sha !== headSha) {
              core.info(`PR head moved ${headSha} -> ${pr.head.sha}; skipping stale comment.`);
              return;
            }

            const marker = '<!-- flake-lock-diff -->';
            const body = marker + '\n' + process.env.COMMENT_BODY;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
